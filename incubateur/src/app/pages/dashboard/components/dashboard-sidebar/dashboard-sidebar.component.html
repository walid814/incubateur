<!-- Lanceur mobile : visible uniquement <=768px (CSS). Ouvre le tiroir. -->
<button
  type="button"
  class="sidebar-launcher"
  [class.is-hidden]="isMobileOpen"
  (click)="toggleMobile()"
  [attr.aria-expanded]="isMobileOpen"
  aria-controls="dashboard-sidebar-panel"
  aria-label="Ouvrir le menu de navigation">
  <mat-icon>menu</mat-icon>
  <span>Menu</span>
</button>

<!-- Scrim : ferme le tiroir au clic. Inerte sur desktop (CSS). -->
<div
  class="sidebar-scrim"
  [class.is-visible]="isMobileOpen"
  (click)="closeMobile()"
  aria-hidden="true">
</div>

<aside
  id="dashboard-sidebar-panel"
  class="sidebar"
  [class.is-open]="isMobileOpen">
  <!-- En-tete mobile du tiroir : titre + fermeture. Masque sur desktop. -->
  <div class="sidebar-mobile-head">
    <span class="sidebar-mobile-title">Navigation</span>
    <button
      type="button"
      class="sidebar-close"
      (click)="closeMobile()"
      aria-label="Fermer le menu de navigation">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <nav class="sidebar-nav">
    @if (isAdmin) {
      <button mat-button routerLink="/admin/users" (click)="closeMobile()"><mat-icon>groups_2</mat-icon><span>Gestion utilisateurs</span></button>
      <button mat-button routerLink="/admin/candidatures" (click)="closeMobile()"><mat-icon>assignment_turned_in</mat-icon><span>Gestion candidatures</span></button>
      <button mat-button routerLink="/register" (click)="closeMobile()"><mat-icon>person_add</mat-icon><span>Créer un compte</span></button>
      <button mat-button routerLink="/admin/projects" (click)="closeMobile()"><mat-icon>assignment</mat-icon><span>Tous les projets</span></button>
      <button mat-button routerLink="/admin/funding" (click)="closeMobile()"><mat-icon>account_balance</mat-icon><span>Financements</span></button>
      <button mat-button routerLink="/admin/reports" (click)="closeMobile()"><mat-icon>analytics</mat-icon><span>Rapports</span></button>
      <button mat-button routerLink="/admin/settings" (click)="closeMobile()"><mat-icon>settings</mat-icon><span>Configuration</span></button>
      <button mat-button routerLink="/admin/support" (click)="closeMobile()"><mat-icon>support_agent</mat-icon><span>Support</span></button>
    }

    @if (isUser) {
      <button mat-button routerLink="/profil" (click)="closeMobile()"><mat-icon>person</mat-icon><span>Profil</span></button>
      <button mat-button routerLink="/mes-projets" (click)="closeMobile()"><mat-icon>flight_takeoff</mat-icon><span>Mes Projets</span></button>
      <button mat-button routerLink="/candidatures" (click)="closeMobile()"><mat-icon>assignment</mat-icon><span>Candidatures</span></button>
      <button mat-button routerLink="/documents" (click)="closeMobile()"><mat-icon>description</mat-icon><span>Documents</span></button>
      <button mat-button routerLink="/formations" (click)="closeMobile()"><mat-icon>school</mat-icon><span>Formations</span></button>
      <button mat-button routerLink="/mentoring" (click)="closeMobile()"><mat-icon>support_agent</mat-icon><span>Mentoring</span></button>
      <button mat-button routerLink="/financement" (click)="closeMobile()"><mat-icon>account_balance</mat-icon><span>Financement</span></button>
      <button mat-button routerLink="/ressources" (click)="closeMobile()"><mat-icon>menu_book</mat-icon><span>Ressources</span></button>
      <button mat-button routerLink="/evenements" (click)="closeMobile()"><mat-icon>event</mat-icon><span>Événements</span></button>
    }

    <div class="sidebar-separator"></div>
    <button mat-button color="warn" (click)="logoutRequested.emit(); closeMobile()"><mat-icon>logout</mat-icon><span>Se déconnecter</span></button>
  </nav>
  <div class="sidebar-footer">
    <a routerLink="/faq" (click)="closeMobile()">Guide pratique entrepreneur<br>FAQ</a>
  </div>
</aside>
